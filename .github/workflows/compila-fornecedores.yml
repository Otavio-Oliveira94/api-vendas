name: Compilar fornecedores-service

on: push

permissions:
  contents: read

jobs:
  build:
    name: Compilar com Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar fornecedores-service
        run: mvn -B -f fornecedores-service/pom.xml clean package -DskipTests